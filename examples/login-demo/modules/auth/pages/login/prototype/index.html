<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号登录 · 北辰工作台</title>
  <link data-proto-bundle="style" href="../../../../../shared/design-system.css">
  <link data-proto-bundle="style" href="./page.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-brand" aria-labelledby="brand-title">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span class="brand-name">北辰工作台</span>
      </div>
      <div class="brand-message">
        <p class="brand-kicker">组织业务入口</p>
        <h1 id="brand-title">任务、数据与流程统一访问</h1>
        <p>仅限已授权的组织成员登录，操作记录将按账号留痕。</p>
      </div>
      <div class="brand-status"><span class="status-dot" aria-hidden="true"></span>演示环境运行正常</div>
    </section>

    <section class="login-main">
      <div class="login-panel">
        <header class="login-heading">
          <span class="environment-badge">演示环境</span>
          <h2>登录账号</h2>
          <p>使用组织账号进入工作台</p>
        </header>

        <div id="notice" class="form-notice" role="status" aria-live="polite" hidden></div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" aria-describedby="username-error">
            <p id="username-error" class="field-error"></p>
          </div>

          <div class="field-group">
            <label for="password">密码</label>
            <div class="password-control">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="password-error">
              <button id="toggle-password" class="password-toggle" type="button" aria-label="显示密码" title="显示密码">显示</button>
            </div>
            <p id="password-error" class="field-error"></p>
          </div>

          <div class="form-options">
            <label class="remember-option"><input id="remember" type="checkbox">记住账号</label>
            <button id="forgot-password" class="text-button" type="button">忘记密码</button>
          </div>

          <button id="submit-button" class="submit-button" type="submit">
            <span class="button-label">登录</span>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <footer class="login-footer">
          <span>受保护的组织入口</span>
          <span>原型版本 v1.0</span>
        </footer>
      </div>
    </section>
  </main>

  <script data-proto-bundle src="./fixtures.js"></script>
  <script data-proto-bundle src="./page.js"></script>
</body>
</html>
