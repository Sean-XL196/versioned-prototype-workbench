<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审批管理</title>
  <style data-source="../../../../../shared/design-system.css">
:root {
  color-scheme: light;
  --vpw-font-sans: Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --vpw-color-canvas: #f4f6f8;
  --vpw-color-surface: #ffffff;
  --vpw-color-surface-muted: #f8fafb;
  --vpw-color-ink: #172126;
  --vpw-color-ink-muted: #5d6b72;
  --vpw-color-border: #d8dfe3;
  --vpw-color-border-strong: #bbc6cc;
  --vpw-color-brand: #0b6b5b;
  --vpw-color-brand-strong: #075448;
  --vpw-color-brand-soft: #e8f4f1;
  --vpw-color-info: #245b8f;
  --vpw-color-info-soft: #eaf2f9;
  --vpw-color-warning: #9a5b08;
  --vpw-color-warning-soft: #fff4dc;
  --vpw-color-danger: #b42318;
  --vpw-color-danger-soft: #fff0ee;
  --vpw-color-success: #16794a;
  --vpw-color-success-soft: #eaf7f0;
  --vpw-shadow-float: 0 12px 32px rgba(23, 33, 38, 0.12);
  --vpw-radius-control: 4px;
  --vpw-radius-panel: 6px;
  --vpw-space-1: 4px;
  --vpw-space-2: 8px;
  --vpw-space-3: 12px;
  --vpw-space-4: 16px;
  --vpw-space-5: 20px;
  --vpw-space-6: 24px;
  --vpw-space-8: 32px;
  --vpw-control-height: 36px;
  --vpw-header-height: 56px;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--vpw-color-canvas); }
body { margin: 0; color: var(--vpw-color-ink); background: var(--vpw-color-canvas); font-family: var(--vpw-font-sans); font-size: 14px; line-height: 1.5; letter-spacing: 0; }
button, input, select, textarea { font: inherit; letter-spacing: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(36, 91, 143, 0.28); outline-offset: 2px; }

.vpw-button {
  min-height: var(--vpw-control-height);
  border: 1px solid var(--vpw-color-border-strong);
  border-radius: var(--vpw-radius-control);
  padding: 7px 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--vpw-color-ink);
  background: var(--vpw-color-surface);
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.vpw-button:hover { border-color: #8c9aa2; background: var(--vpw-color-surface-muted); }
.vpw-button--primary { border-color: var(--vpw-color-brand); color: #fff; background: var(--vpw-color-brand); }
.vpw-button--primary:hover { border-color: var(--vpw-color-brand-strong); background: var(--vpw-color-brand-strong); }
.vpw-button--danger { border-color: #e5aaa4; color: var(--vpw-color-danger); background: var(--vpw-color-danger-soft); }
.vpw-button--icon { width: var(--vpw-control-height); padding: 0; }
.vpw-button[disabled] { opacity: 0.5; cursor: not-allowed; }

.vpw-field { display: grid; gap: 6px; min-width: 0; }
.vpw-label { color: var(--vpw-color-ink-muted); font-size: 12px; font-weight: 650; }
.vpw-input, .vpw-select {
  width: 100%;
  height: var(--vpw-control-height);
  border: 1px solid var(--vpw-color-border-strong);
  border-radius: var(--vpw-radius-control);
  padding: 0 11px;
  color: var(--vpw-color-ink);
  background: var(--vpw-color-surface);
}
.vpw-input::placeholder { color: #8a969d; }

.vpw-badge {
  min-height: 24px;
  border: 1px solid var(--vpw-color-border);
  border-radius: 999px;
  padding: 2px 9px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--vpw-color-ink-muted);
  background: var(--vpw-color-surface-muted);
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}
.vpw-badge::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
.vpw-badge--success { border-color: #b9dfca; color: var(--vpw-color-success); background: var(--vpw-color-success-soft); }
.vpw-badge--warning { border-color: #eed39a; color: var(--vpw-color-warning); background: var(--vpw-color-warning-soft); }
.vpw-badge--danger { border-color: #f0b8b2; color: var(--vpw-color-danger); background: var(--vpw-color-danger-soft); }
.vpw-badge--info { border-color: #b9d1e6; color: var(--vpw-color-info); background: var(--vpw-color-info-soft); }

.vpw-panel { border: 1px solid var(--vpw-color-border); border-radius: var(--vpw-radius-panel); background: var(--vpw-color-surface); }
.vpw-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--vpw-color-border); border-radius: var(--vpw-radius-panel); background: var(--vpw-color-surface); }
.vpw-table { width: 100%; min-width: 680px; border-collapse: collapse; table-layout: fixed; }
.vpw-table th, .vpw-table td { padding: 12px 14px; border-bottom: 1px solid #e8edef; text-align: left; vertical-align: middle; overflow-wrap: anywhere; }
.vpw-table th { color: var(--vpw-color-ink-muted); background: var(--vpw-color-surface-muted); font-size: 12px; font-weight: 700; }
.vpw-table tbody tr:last-child td { border-bottom: 0; }
.vpw-table tbody tr:hover { background: #fbfcfc; }

.vpw-empty { min-height: 180px; padding: 32px; display: grid; place-items: center; color: var(--vpw-color-ink-muted); text-align: center; }
.vpw-toast { position: fixed; right: 20px; bottom: 20px; z-index: 50; max-width: min(420px, calc(100vw - 40px)); border: 1px solid #b9d1e6; border-radius: var(--vpw-radius-panel); padding: 12px 14px; color: var(--vpw-color-info); background: var(--vpw-color-info-soft); box-shadow: var(--vpw-shadow-float); }
[hidden] { display: none !important; }

@media (max-width: 720px) {
  .vpw-button { min-height: 40px; }
  .vpw-toast { right: 12px; bottom: 12px; max-width: calc(100vw - 24px); }
}

</style>
  <style data-source="../../../../../shared/shell.css">
.prototype-app { min-height: 100vh; }
.app-bar { min-height: var(--vpw-header-height); border-bottom: 1px solid var(--vpw-color-border); padding: 0 var(--vpw-space-6); display: flex; align-items: center; justify-content: space-between; gap: var(--vpw-space-4); background: var(--vpw-color-surface); }
.app-brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 750; }
.app-brand__mark { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: #fff; background: var(--vpw-color-brand); font-size: 12px; }
.app-brand__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-context { display: flex; align-items: center; gap: var(--vpw-space-2); color: var(--vpw-color-ink-muted); font-size: 12px; }
.app-layout { min-height: calc(100vh - var(--vpw-header-height)); display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.app-nav { border-right: 1px solid var(--vpw-color-border); padding: var(--vpw-space-5) var(--vpw-space-3); background: #f9fbfb; }
.app-nav__label { margin: 0 10px 8px; color: #7a878d; font-size: 11px; font-weight: 750; text-transform: uppercase; }
.app-nav__item { width: 100%; border: 0; border-radius: var(--vpw-radius-control); padding: 9px 10px; display: flex; align-items: center; gap: 9px; color: var(--vpw-color-ink-muted); background: transparent; text-align: left; cursor: pointer; }
.app-nav__item[aria-current="page"] { color: var(--vpw-color-brand-strong); background: var(--vpw-color-brand-soft); font-weight: 700; }
.app-nav__dot { width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 2px; }
.workspace { min-width: 0; padding: 28px clamp(18px, 3vw, 40px) 48px; }
.breadcrumbs { margin-bottom: 8px; color: var(--vpw-color-ink-muted); font-size: 12px; }
.page-heading { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.page-heading h1 { margin: 0; font-size: 24px; line-height: 1.25; }
.page-heading p { max-width: 720px; margin: 7px 0 0; color: var(--vpw-color-ink-muted); }
.page-actions { display: flex; align-items: center; gap: 8px; }
.metrics { margin-bottom: 20px; border-block: 1px solid var(--vpw-color-border); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--vpw-color-surface); }
.metric { min-width: 0; padding: 16px 18px; border-right: 1px solid var(--vpw-color-border); }
.metric:last-child { border-right: 0; }
.metric__label { color: var(--vpw-color-ink-muted); font-size: 12px; }
.metric__value { margin-top: 3px; font-size: 19px; font-weight: 760; }
.toolbar { margin-bottom: 14px; display: grid; grid-template-columns: minmax(220px, 1fr) 180px auto; align-items: end; gap: 10px; }
.record-id { display: grid; gap: 2px; font-weight: 700; }
.record-id small { color: var(--vpw-color-ink-muted); font-weight: 500; }
.amount { font-variant-numeric: tabular-nums; font-weight: 650; }
.notice { margin-bottom: 14px; border-left: 3px solid var(--vpw-color-info); padding: 10px 12px; color: var(--vpw-color-info); background: var(--vpw-color-info-soft); }
.notice[data-tone="success"] { border-left-color: var(--vpw-color-success); color: var(--vpw-color-success); background: var(--vpw-color-success-soft); }
.notice[data-tone="danger"] { border-left-color: var(--vpw-color-danger); color: var(--vpw-color-danger); background: var(--vpw-color-danger-soft); }

@media (max-width: 900px) {
  .app-layout { grid-template-columns: 1fr; }
  .app-nav { display: none; }
  .workspace { padding-top: 22px; }
}
@media (max-width: 640px) {
  .app-bar { padding: 10px 14px; align-items: flex-start; flex-direction: column; }
  .page-heading { flex-direction: column; }
  .page-actions { width: 100%; }
  .page-actions .vpw-button { flex: 1; }
  .metrics { grid-template-columns: 1fr; }
  .metric { border-right: 0; border-bottom: 1px solid var(--vpw-color-border); }
  .metric:last-child { border-bottom: 0; }
  .toolbar { grid-template-columns: 1fr; }
}

</style>
  <style data-source="./page.css">
.section-title { margin: 0 0 12px; font-size: 16px; }
.status-cell { display: flex; align-items: center; gap: 8px; }
.status-cell::before { width: 7px; height: 7px; border-radius: 50%; background: var(--vpw-color-success); content: ""; }
.status-cell[data-status="Blocked"] { color: var(--vpw-color-danger); }
.status-cell[data-status="Blocked"]::before { background: var(--vpw-color-danger); }

</style>
</head>
<body>
  <div class="prototype-app">
    <header class="app-bar">
      <div class="app-brand"><span class="app-brand__mark" aria-hidden="true">VP</span><span class="app-brand__name">审批管理</span></div>
      <div class="app-context"><span class="vpw-badge vpw-badge--info">评审原型</span><span>approvals</span></div>
    </header>
    <div class="app-layout">
      <nav class="app-nav" aria-label="原型导航">
        <p class="app-nav__label">工作区</p>
        <button class="app-nav__item" aria-current="page" type="button"><span class="app-nav__dot" aria-hidden="true"></span>业务记录</button>
      </nav>
      <main class="workspace">
        <div class="breadcrumbs">工作区 / 审批管理</div>
        <header class="page-heading">
          <div><h1>审批管理</h1><p>查看当前业务记录与评审状态。</p></div>
          <div class="page-actions"><button id="secondary-action" class="vpw-button" type="button">导出 CSV</button><button id="primary-action" class="vpw-button vpw-button--primary" type="button">执行操作</button></div>
        </header>
        <section class="metrics" aria-label="汇总信息">
          <div class="metric"><div class="metric__label">记录总数</div><div class="metric__value" id="metric-total">0</div></div>
          <div class="metric"><div class="metric__label">可处理</div><div class="metric__value" id="metric-ready">0</div></div>
          <div class="metric"><div class="metric__label">已阻塞</div><div class="metric__value" id="metric-blocked">0</div></div>
        </section>
        <div id="notice" class="notice" role="status">原型已准备好，可以开始评审。</div>
        <section aria-labelledby="records-heading">
          <h2 id="records-heading" class="section-title">业务记录</h2>
          <div class="toolbar">
            <label class="vpw-field"><span class="vpw-label">搜索</span><input id="search" class="vpw-input" type="search" placeholder="按记录编号搜索"></label>
            <label class="vpw-field"><span class="vpw-label">状态</span><select id="status-filter" class="vpw-select"><option value="">全部状态</option><option value="Ready">可处理</option><option value="Blocked">已阻塞</option></select></label>
            <button id="reset-filters" class="vpw-button" type="button">重置</button>
          </div>
          <div class="vpw-table-wrap">
            <table class="vpw-table"><thead><tr><th style="width:42%">记录</th><th style="width:28%">状态</th><th style="width:30%">金额</th></tr></thead><tbody id="rows"></tbody></table>
            <div id="empty-state" class="vpw-empty" hidden>没有符合当前筛选条件的记录。</div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script data-source="../../../../../shared/shell.js">
window.PrototypeShell = {
  notify: function notify(message, tone) {
    var el = document.getElementById('notice');
    if (!el) return;
    el.textContent = message;
    el.dataset.tone = tone || 'info';
  }
};

</script>
  <script data-source="./fixtures.js">
window.PAGE_FIXTURES = [
  { id: 'approvals-001', status: 'Ready', amount: 120, owner: '财务评审' },
  { id: 'approvals-002', status: 'Blocked', amount: 0, owner: '运营评审' },
  { id: 'approvals-003', status: 'Ready', amount: 86, owner: '经理评审' }
];

</script>
  <script data-source="./page.js">
(function () {
  var search = document.getElementById('search');
  var statusFilter = document.getElementById('status-filter');
  var rows = document.getElementById('rows');
  var empty = document.getElementById('empty-state');

  function statusLabel(status) {
    return status === 'Ready' ? '可处理' : status === 'Blocked' ? '已阻塞' : status;
  }

  function filteredRecords() {
    var query = search.value.trim().toLowerCase();
    var status = statusFilter.value;
    return window.PAGE_FIXTURES.filter(function (item) {
      return (!query || item.id.toLowerCase().includes(query)) && (!status || item.status === status);
    });
  }

  function render() {
    var records = filteredRecords();
    rows.innerHTML = records.map(function (item) {
      return '<tr><td><span class="record-id">' + item.id + '<small>' + item.owner + '</small></span></td><td><span class="status-cell" data-status="' + item.status + '">' + statusLabel(item.status) + '</span></td><td class="amount">' + item.amount.toLocaleString() + '</td></tr>';
    }).join('');
    rows.closest('table').hidden = records.length === 0;
    empty.hidden = records.length !== 0;
  }

  document.getElementById('metric-total').textContent = window.PAGE_FIXTURES.length;
  document.getElementById('metric-ready').textContent = window.PAGE_FIXTURES.filter(function (item) { return item.status === 'Ready'; }).length;
  document.getElementById('metric-blocked').textContent = window.PAGE_FIXTURES.filter(function (item) { return item.status === 'Blocked'; }).length;
  search.addEventListener('input', render);
  statusFilter.addEventListener('change', render);
  document.getElementById('reset-filters').addEventListener('click', function () { search.value = ''; statusFilter.value = ''; render(); search.focus(); });
  document.getElementById('secondary-action').addEventListener('click', function () {
    var content = ['记录编号,状态,金额'].concat(filteredRecords().map(function (item) { return [item.id, statusLabel(item.status), item.amount].join(','); })).join('\n');
    var url = URL.createObjectURL(new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8' }));
    var link = document.createElement('a');
    link.href = url;
    link.download = '原型记录.csv';
    link.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    window.PrototypeShell.notify('已按当前筛选结果生成 CSV 文件。', 'success');
  });
  document.getElementById('primary-action').addEventListener('click', function () {
    var blocked = filteredRecords().some(function (item) { return item.status === 'Blocked'; });
    window.PrototypeShell.notify(blocked ? '当前结果中存在已阻塞记录，处理后才能完成操作。' : '已完成当前结果集的操作。', blocked ? 'danger' : 'success');
  });
  render();
}());

</script>
</body>
</html>
